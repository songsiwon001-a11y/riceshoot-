<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice Shoot!</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { background: #050508; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Press Start 2P', monospace; overflow: auto; user-select: none; }
        #canvas { background: #0a0a16; border: 6px solid #1e1e38; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); border-radius: 12px; image-rendering: pixelated; max-width: 100%; height: auto; }
        .hud { font-family: 'Press Start 2P', monospace; }
        .ctrl-btn { background: #1f2937; border: 3px solid #4b5563; color: white; font-weight: bold; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
        .ctrl-btn:active { background: #374151; }
    </style>
</head>
<body class="p-4">
    <div id="ui" class="absolute text-center z-10 bg-black/90 p-10 rounded-2xl border-4 border-yellow-500 max-w-lg">
        <h1 class="text-4xl font-bold mb-6 text-yellow-400">RICE SHOOT!</h1>
        <p class="text-sm text-gray-300 leading-relaxed mb-8">
            블록과 적을 쏘아 67 아이템을 획득하세요!<br><br>
            [이동] 방향키 / WASD / 화면 버튼<br>
            [공격] Space Bar / 슈팅 버튼
        </p>
        <button id="start-btn" class="px-10 py-5 bg-emerald-600 text-white text-xl font-bold rounded-xl border-b-8 border-emerald-800 hover:brightness-110 active:translate-y-2 active:border-b-0 transition-all cursor-pointer">
            START GAME
        </button>
        <p class="mt-8 text-[10px] text-gray-500">Copyright 2026 super rice jamjam studio.</p>
    </div>

    <div class="w-full max-w-[800px] flex justify-between items-center mb-3 hud px-2 text-xs">
        <div class="flex gap-4">
            <span class="text-red-500">LIFE: <span id="life-val">5</span></span>
            <span class="text-yellow-400">SCORE: <span id="score-val">0</span></span>
        </div>
    </div>

    <canvas id="canvas" width="800" height="600"></canvas>

    <div class="w-full max-w-[800px] mt-4 flex justify-between items-center px-2">
        <div class="grid grid-cols-3 gap-2 w-40 h-40">
            <div></div>
            <button id="btn-up" class="ctrl-btn text-lg">▲</button>
            <div></div>
            <button id="btn-left" class="ctrl-btn text-lg">◀</button>
            <div></div>
            <button id="btn-right" class="ctrl-btn text-lg">▶</button>
            <div></div>
            <button id="btn-down" class="ctrl-btn text-lg">▼</button>
            <div></div>
        </div>
        <div class="flex gap-2">
            <button id="btn-shoot" class="ctrl-btn w-28 h-20 bg-emerald-700 text-xs border-emerald-500">FIRE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drumPlayers, sixSevenPlayer, deathPlayer, isStarted = false;

        const synthMelody = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.02, decay: 0.1, sustain: 0.4, release: 0.1 } }).toDestination();
        const synthBass = new Tone.MonoSynth({ oscillator: { type: "triangle" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.8, release: 0.2 } }).toDestination();
        const missileSynth = new Tone.MonoSynth({ oscillator: { type: "sine" }, envelope: { attack: 0.005, decay: 0.25, sustain: 0.01, release: 0.1 } }).toDestination();

        const melodySeq = new Tone.Sequence((time, note) => { if (note) synthMelody.triggerAttackRelease(note, "16n", time); }, ["E5", "G5", "A5", null, "A5", "G5", "E5", "C5", "D5", "D5", "E5", "G5", "A5", null, "G5", "A5"], "8n");
        const bassSeq = new Tone.Sequence((time, note) => { if (note) synthBass.triggerAttackRelease(note, "8n", time); }, ["A2", "A2", "G2", "G2", "E2", "E2", "C2", "D2", "A2", "A2", "G2", "G2", "C3", "B2", "G2", "E2"], "4n");

        let drumStep = 0;
        const customDrumLoop = new Tone.Loop((time) => {
            const patterns = ["drum1", null, "drum2", null, "drum3", "drum1", "drum4", null, "drum1", "drum2", "drum3", null, "drum2", null, "drum5", "drum3"];
            const trigger = patterns[drumStep % patterns.length];
            if (trigger && drumPlayers && drumPlayers.loaded) drumPlayers.player(trigger).start(time);
            drumStep++;
        }, "8n");

        let player = { x: 80, y: 280, w: 42, h: 42, invincible: false, invincibleTimer: 0, lives: 5 };
        let bullets = [], enemies = [], blocks = [], items = [], score = 0, keys = {}, shootCooldown = 0;

        document.getElementById('start-btn').addEventListener('click', async () => {
            await Tone.start();
            drumPlayers = new Tone.Players({ drum1: "rice jump drum.wav", drum2: "rice jump drum2.wav", drum3: "rice jump drum3.wav", drum4: "rice jump drum4.wav", drum5: "rice jump drum5.wav" }).toDestination();
            sixSevenPlayer = new Tone.Player("six seven!.mp3").toDestination();
            deathPlayer = new Tone.Player("라이스슈트 죽는 소리.mp3").toDestination();
            Tone.Transport.bpm.value = 135;
            melodySeq.start(0); bassSeq.start(0); customDrumLoop.start(0); Tone.Transport.start();
            document.getElementById('ui').style.display = 'none';
            isStarted = true;
            initializeGame();
            requestAnimationFrame(gameLoop);
        });

        function initializeGame() {
            player.lives = 5; score = 0; bullets = []; enemies = []; blocks = []; items = []; player.invincible = false;
            document.getElementById('life-val').innerText = player.lives;
            document.getElementById('score-val').innerText = score;
            for (let i = 0; i < 4; i++) blocks.push({ x: 800 + Math.random() * 200, y: 80 + Math.random() * 400, hp: 4 });
        }

        function gameLoop() {
            if (!isStarted) return;
            ctx.clearRect(0, 0, 800, 600);
            
            if (keys["ArrowUp"] || keys["w"]) player.y = Math.max(10, player.y - 6.5);
            if (keys["ArrowDown"] || keys["s"]) player.y = Math.min(550, player.y + 6.5);
            if (keys["ArrowLeft"] || keys["a"]) player.x = Math.max(10, player.x - 6.5);
            if (keys["ArrowRight"] || keys["d"]) player.x = Math.min(750, player.x + 6.5);
            
            if (player.invincible) {
                player.invincibleTimer -= 16.67;
                if (player.invincibleTimer <= 0) player.invincible = false;
            }

            ctx.fillStyle = player.invincible ? "gold" : "#10b981";
            ctx.fillRect(player.x, player.y, player.w, player.h);
            
            bullets.forEach((b, i) => { 
                b.x += 16; 
                ctx.fillStyle = player.invincible ? "#f43f5e" : "#38bdf8"; 
                ctx.fillRect(b.x, b.y, player.invincible ? 24 : 18, player.invincible ? 10 : 8); 
                if(b.x > 800) bullets.splice(i, 1); 
            });

            blocks.forEach((b, i) => { 
                b.x -= 1.2; 
                ctx.fillStyle = "#eab308"; 
                ctx.fillRect(b.x, b.y, 55, 55); 
                if(b.x < -100) blocks.splice(i, 1);
            });

            enemies.forEach((e, i) => {
                e.x -= 3;
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(e.x, e.y, 30, 30);
                if (player.x < e.x + 30 && player.x + 42 > e.x && player.y < e.y + 30 && player.y + 42 > e.y) {
                    enemies.splice(i, 1);
                    if (!player.invincible) {
                        player.lives--;
                        document.getElementById('life-val').innerText = player.lives;
                        if(deathPlayer && deathPlayer.loaded) deathPlayer.start();
                        if (player.lives <= 0) isStarted = false;
                    }
                }
                if (e.x < -30) enemies.splice(i, 1);
            });

            if (Math.random() < 0.02) enemies.push({ x: 800, y: Math.random() * 550 });

            if (blocks.length < 4 && Math.random() < 0.02) {
                blocks.push({ x: 820, y: 80 + Math.random() * 400, hp: 4 });
            }

            items.forEach((item, i) => {
                item.x -= 1.5;
                ctx.fillStyle = "#22d3ee";
                ctx.fillRect(item.x, item.y, item.w, item.h);
                if (player.x < item.x + item.w && player.x + player.w > item.x && player.y < item.y + item.h && player.y + player.h > item.y) {
                    items.splice(i, 1);
                    player.invincible = true;
                    player.invincibleTimer = 5000;
                    if (sixSevenPlayer && sixSevenPlayer.loaded) sixSevenPlayer.start();
                }
                if (item.x < -50) items.splice(i, 1);
            });

            blocks.forEach((b, bi) => {
                bullets.forEach((bl, bli) => {
                    if (bl.x < b.x + 55 && bl.x + 18 > b.x && bl.y < b.y + 55 && bl.y + 8 > b.y) {
                        bullets.splice(bli, 1);
                        b.hp--;
                        if (b.hp <= 0) {
                            items.push({ x: b.x + 10, y: b.y + 10, w: 32, h: 32 });
                            blocks.splice(bi, 1);
                            score += 100;
                            document.getElementById('score-val').innerText = score;
                        }
                    }
                });
            });

            let fireInterval = player.invincible ? 4 : 12;
            if ((keys[" "] || player.invincible) && shootCooldown <= 0) { 
                bullets.push({ x: player.x + 42, y: player.y + 16 }); 
                const now = Tone.now();
                missileSynth.triggerAttackRelease("C5", "16n", now);
                missileSynth.frequency.setValueAtTime(800, now);
                missileSynth.frequency.exponentialRampToValueAtTime(150, now + 0.2);
                shootCooldown = fireInterval; 
            }
            if (shootCooldown > 0) shootCooldown--;

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', e => { if(e.key === " ") keys[" "] = true; else keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(e.key === " ") keys[" "] = false; else keys[e.key] = false; });

        const setupBtn = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('pointerdown', () => keys[key] = true);
            el.addEventListener('pointerup', () => keys[key] = false);
            el.addEventListener('pointerleave', () => keys[key] = false);
        };
        setupBtn('btn-up', 'ArrowUp'); setupBtn('btn-down', 'ArrowDown');
        setupBtn('btn-left', 'ArrowLeft'); setupBtn('btn-right', 'ArrowRight');
        setupBtn('btn-shoot', ' ');
    </script>
</body>
</html>
